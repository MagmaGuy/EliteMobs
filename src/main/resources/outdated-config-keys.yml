# Files matching these retirement rules are preserved by MagmaCore
# before configuration loading. Current defaults regenerate through their owners.
# Regenerate Casus when his quest list exactly matches either older default.
# The current four-quest default and other quest lists do not match.
npcs:
  - files: [guide_1.yml]
    key: questFileName
    value: [ag_welcome_quest_1.yml]
  - files: [guide_1.yml]
    key: questFileName
    value: [ag_welcome_quest_1.yml, ag_adventurer_training.yml]

# Scotty does not spawn with scrolls disabled. Regenerate the old welcome quest
# without his objective; its replacement no longer matches this rule.
customquests:
  - files: [ag_welcome_quest_1.yml]
    key: customObjectives.Objective13.filename
    value: scroll_applier_config.yml

# Death's Embrace described its old 20% heal and 60s cooldown before its rebalance.
skillbonuses:
  - files: [hoes_deaths_embrace.yml]
    key: description
    value: ['&7Cheat death once and', '&7revive with 20% health. 60s CD.']

# Weapon menus from before Dali's menu art keep slots outside its frames. The
# current layout moves wands from 25 to 24, so only unedited menus match.
menus:
  - files: [skill_bonus_menu.yml]
    key: wandsSlot
    value: 25

enchantments:
